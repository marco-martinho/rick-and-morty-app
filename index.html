<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Rick and Morty Character Log</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1 class="title">Rick and Morty</h1>

        <div class="page-header__controls">
          <div class="search-bar-container" data-js="search-bar-container">
            <form action="" class="search-bar" data-js="search-bar">
              <input
                name="query"
                class="search-bar__input"
                type="text"
                placeholder="search characters"
                aria-label="character name"
              />
              <button
                class="search-bar__button"
                aria-label="search for character"
              >
                <img
                  class="search-bar__icon"
                  src="assets/magnifying-glass.png"
                  alt=""
                />
              </button>
            </form>
          </div>

          <nav
            class="navigation navigation--top"
            data-js="navigation-top"
          ></nav>
        </div>
      </header>

      <nav class="navigation" data-js="navigation-top"></nav>

      <ul class="card-container" data-js="card-container"></ul>

      <nav class="navigation" data-js="navigation-bottom"></nav>
    </main>
  </body>
</html>
